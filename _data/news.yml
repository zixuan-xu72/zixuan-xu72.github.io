  text: "Joined MIT's Department of Urban Studies and Planning as a Visiting Student Researcher, working with [Prof. Jinhua Zhao](https://mobility.mit.edu/people/jinhua-zhao/) in the [JTL Urban Mobility Lab](https://mobility.mit.edu/)."

- date: 2026-09-01
  text: "Gave an invited industry seminar on large language models for intelligent vehicles at the Korea Automotive Technology Institute (KATECH)."

- date: 2026-07-01
  text: "Received the Best Lightning Talk Award at CICTP 2026."

- date: 2026-06-01
  text: "Survey paper on [large language models for human–machine interaction in autonomous vehicles](/publication/2026-06-25-llm-hmi-av-survey) published in *Transportation Research Part C*."

- date: 2026-02-01
  text: "Received the Readers’ Choice Award from KAIST Breakthroughs, the College of Engineering research webzine."

- date: 2025-12-01
  text: "Gave two talks at HKSTS 2025, on [LLM-TripPlanner](/publication/2025-06-01-llm-tripplanner) and on LLM decision-making in ethical dilemmas of autonomous vehicles."

- date: 2025-09-01
